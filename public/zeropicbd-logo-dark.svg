<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 115" width="100%" height="100%" fill="none">
  <defs>
    <!-- Z Ribbon Gradients -->
    <linearGradient id="zpTopDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="50%" stop-color="#007BFF" />
      <stop offset="100%" stop-color="#7A3BFF" />
    </linearGradient>

    <linearGradient id="zpFoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056B3" />
      <stop offset="100%" stop-color="#050D20" />
    </linearGradient>

    <linearGradient id="zpDiagDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="40%" stop-color="#007BFF" />
      <stop offset="100%" stop-color="#7A3BFF" />
    </linearGradient>

    <linearGradient id="zpWaveDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007BFF" />
      <stop offset="50%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#7A3BFF" />
    </linearGradient>

    <linearGradient id="zpBdGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="60%" stop-color="#007BFF" />
      <stop offset="100%" stop-color="#7A3BFF" />
    </linearGradient>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="100%" height="100%" rx="16" fill="#0A1B3D" />

  <!-- ================= 1. 3D RIBBON Z EMBLEM + CART ================= -->
  <g transform="translate(10, 4) scale(0.35)">
    <!-- Back Echo Ribbon Swoosh 2 -->
    <path
      d="M 230 45 C 290 55, 340 90, 350 150 C 330 170, 290 190, 250 205 C 285 180, 315 150, 305 110 C 295 75, 255 55, 230 45 Z"
      fill="#00C6FF"
      opacity="0.8"
    />

    <!-- Back Echo Ribbon Swoosh 1 -->
    <path
      d="M 210 38 C 265 46, 315 80, 325 135 C 300 160, 260 185, 220 200 C 260 175, 290 145, 280 100 C 270 70, 235 50, 210 38 Z"
      fill="#007BFF"
      opacity="0.9"
    />

    <!-- Main Z Top Bar -->
    <path
      d="M 70 48 C 65 48, 55 52, 45 60 C 90 35, 170 30, 240 38 C 295 45, 335 85, 330 140 C 325 180, 290 208, 250 220 C 280 195, 300 165, 295 130 C 290 85, 255 60, 195 55 C 150 50, 100 50, 70 48 Z"
      fill="url(#zpTopDark)"
    />

    <!-- Inner 3D Fold -->
    <path
      d="M 170 54 L 140 140 C 160 110, 195 90, 230 80 C 255 72, 275 80, 270 105 C 265 125, 245 150, 210 180 L 160 220 L 130 150 L 155 75 Z"
      fill="url(#zpFoldDark)"
    />

    <!-- Main Dynamic Diagonal Z Ribbon -->
    <path
      d="M 50 60 L 195 54 C 180 85, 150 140, 115 190 C 85 235, 55 270, 35 285 C 25 292, 35 300, 55 295 C 90 285, 140 240, 175 195 L 205 155 C 240 110, 275 75, 240 50 C 205 45, 120 50, 50 60 Z"
      fill="url(#zpDiagDark)"
    />

    <!-- Lower Flowing Base Wave -->
    <path
      d="M 35 285 C 55 280, 85 255, 125 220 C 160 190, 195 180, 230 205 C 250 220, 260 245, 235 265 C 205 285, 155 295, 95 300 C 65 302, 45 298, 35 285 Z"
      fill="url(#zpWaveDark)"
    />

    <!-- Speed Shopping Cart -->
    <g transform="translate(205, 190)">
      <line x1="0" y1="20" x2="22" y2="20" stroke="#00C6FF" stroke-width="5.5" stroke-linecap="round" />
      <line x1="6" y1="33" x2="26" y2="33" stroke="#00C6FF" stroke-width="5.5" stroke-linecap="round" />
      <line x1="14" y1="46" x2="30" y2="46" stroke="#00C6FF" stroke-width="5.5" stroke-linecap="round" />

      <path
        d="M 32 5 L 42 5 L 56 42 L 88 42 L 98 12 L 44 12"
        stroke="#FFFFFF"
        stroke-width="5.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
      <!-- Cart Grid Slats -->
      <line x1="50" y1="22" x2="94" y2="22" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
      <line x1="53" y1="32" x2="90" y2="32" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

      <!-- Wheels -->
      <circle cx="58" cy="58" r="6.5" fill="#FFFFFF" />
      <circle cx="84" cy="58" r="6.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ================= 2. COMPLETE BRAND TYPOGRAPHY ================= -->
  <g transform="translate(144, 10)">
    <!-- Main ZeropicBD Text -->
    <text x="0" y="66" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
      <tspan fill="#FFFFFF">Zeropic</tspan>
      <tspan fill="url(#zpBdGradDark)">BD</tspan>
    </text>

    <!-- Tagline: SHOP SMART • LIVE BETTER -->
    <text x="2" y="98" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="11.5" letter-spacing="3.8" fill="#CBD5E1">
      SHOP SMART <tspan fill="#00C6FF" font-size="14" font-weight="900">•</tspan> LIVE BETTER
    </text>
  </g>
</svg>
