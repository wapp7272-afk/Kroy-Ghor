<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="socBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#14264F" />
      <stop offset="60%" stop-color="#0A1B3D" />
      <stop offset="100%" stop-color="#050C1C" />
    </radialGradient>

    <!-- Ambient Glow Behind Emblem -->
    <radialGradient id="socGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#00C6FF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#7A3BFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Z Ribbon Gradients -->
    <linearGradient id="socTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="45%" stop-color="#007BFF" />
      <stop offset="100%" stop-color="#7A3BFF" />
    </linearGradient>

    <linearGradient id="socFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056B3" />
      <stop offset="60%" stop-color="#0A1B3D" />
      <stop offset="100%" stop-color="#050D20" />
    </linearGradient>

    <linearGradient id="socDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="35%" stop-color="#007BFF" />
      <stop offset="75%" stop-color="#0056B3" />
      <stop offset="100%" stop-color="#7A3BFF" />
    </linearGradient>

    <linearGradient id="socWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007BFF" />
      <stop offset="50%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#7A3BFF" />
    </linearGradient>

    <linearGradient id="socBdText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="60%" stop-color="#007BFF" />
      <stop offset="100%" stop-color="#7A3BFF" />
    </linearGradient>
  </defs>

  <!-- Base Square Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#socBg)" />
  <circle cx="256" cy="225" r="190" fill="url(#socGlow)" />

  <!-- Subtle Outer Accent Ring for Circular Cropping Reference -->
  <circle cx="256" cy="256" r="248" stroke="#00C6FF" stroke-opacity="0.12" stroke-width="2" />

  <!-- Centered 3D Ribbon Z Emblem with Speed Shopping Cart -->
  <!-- Scaled and positioned so it fits comfortably within the circular crop -->
  <g transform="translate(132, 75) scale(0.72)">
    <!-- Back Echo Swoosh 2 -->
    <path
      d="M 230 45 C 290 55, 340 90, 350 150 C 330 170, 290 190, 250 205 C 285 180, 315 150, 305 110 C 295 75, 255 55, 230 45 Z"
      fill="#80E5FF"
      opacity="0.85"
    />

    <!-- Back Echo Swoosh 1 -->
    <path
      d="M 210 38 C 265 46, 315 80, 325 135 C 300 160, 260 185, 220 200 C 260 175, 290 145, 280 100 C 270 70, 235 50, 210 38 Z"
      fill="#00C6FF"
    />

    <!-- Main Z Top Bar -->
    <path
      d="M 70 48 C 65 48, 55 52, 45 60 C 90 35, 170 30, 240 38 C 295 45, 335 85, 330 140 C 325 180, 290 208, 250 220 C 280 195, 300 165, 295 130 C 290 85, 255 60, 195 55 C 150 50, 100 50, 70 48 Z"
      fill="url(#socTop)"
    />

    <!-- Inner 3D Fold -->
    <path
      d="M 170 54 L 140 140 C 160 110, 195 90, 230 80 C 255 72, 275 80, 270 105 C 265 125, 245 150, 210 180 L 160 220 L 130 150 L 155 75 Z"
      fill="url(#socFold)"
    />

    <!-- Diagonal Z Ribbon -->
    <path
      d="M 50 60 L 195 54 C 180 85, 150 140, 115 190 C 85 235, 55 270, 35 285 C 25 292, 35 300, 55 295 C 90 285, 140 240, 175 195 L 205 155 C 240 110, 275 75, 240 50 C 205 45, 120 50, 50 60 Z"
      fill="url(#socDiag)"
    />

    <!-- Base Wave -->
    <path
      d="M 35 285 C 55 280, 85 255, 125 220 C 160 190, 195 180, 230 205 C 250 220, 260 245, 235 265 C 205 285, 155 295, 95 300 C 65 302, 45 298, 35 285 Z"
      fill="url(#socWave)"
    />

    <!-- Speed Shopping Cart -->
    <g transform="translate(205, 190)">
      <line x1="0" y1="20" x2="22" y2="20" stroke="#00C6FF" stroke-width="6" stroke-linecap="round" />
      <line x1="6" y1="33" x2="26" y2="33" stroke="#00C6FF" stroke-width="6" stroke-linecap="round" />
      <line x1="14" y1="46" x2="30" y2="46" stroke="#00C6FF" stroke-width="6" stroke-linecap="round" />

      <path
        d="M 32 5 L 42 5 L 56 42 L 88 42 L 98 12 L 44 12"
        stroke="#FFFFFF"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
      <line x1="50" y1="22" x2="94" y2="22" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
      <line x1="53" y1="32" x2="90" y2="32" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

      <circle cx="58" cy="58" r="7" fill="#FFFFFF" />
      <circle cx="84" cy="58" r="7" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Wordmark at Bottom (Inside Safe Avatar Circle Area) -->
  <text
    x="256"
    y="395"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="44"
    letter-spacing="-0.5"
  >
    <tspan fill="#FFFFFF">Zeropic</tspan>
    <tspan fill="url(#socBdText)">BD</tspan>
  </text>

  <text
    x="256"
    y="426"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-weight="700"
    font-size="11"
    letter-spacing="4.5"
    fill="#94A3B8"
  >
    SHOP SMART <tspan fill="#00C6FF">•</tspan> LIVE BETTER
  </text>
</svg>
